<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grammar Hacks – ফ্ল্যাশ কার্ড</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe8;--card:#fbf9f4;--ink:#3a3836;--mut:#8a857c;--line:#e5dfd4;--acc:#4a6a8a;--ok:#4f8a6a;--okb:#e0ece4;--bad:#b4493f;--badb:#f3dcd8;--star:#b8860b;--starb:#e4e9f1;--sh:0 2px 10px rgba(60,50,30,.08);--fs:1}
[data-th=dark]{--bg:#1d1f22;--card:#27292d;--ink:#cfcbc3;--mut:#908c84;--line:#383b40;--acc:#8fb0d0;--ok:#7fc29c;--okb:#2a3a31;--bad:#e08b82;--badb:#3d2a28;--star:#d9b04c;--starb:#2c3340;--sh:0 2px 10px rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali",Nikosh,system-ui,sans-serif;font-size:calc(17px*var(--fs));line-height:1.7;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.home{overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:1.5em;line-height:1.3;margin:6px 0 2px}.sub{color:var(--mut);font-size:.9em}
.box{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:18px}
.big{font-size:2.6em;font-weight:700;line-height:1}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .3s}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:5px 13px;border-radius:20px;font-size:.88em}
.c1{background:var(--okb);color:var(--ok)}.c2{background:var(--badb);color:var(--bad)}.c3{background:var(--starb);color:var(--star)}
h3{font-size:.95em;color:var(--mut);margin:22px 0 10px;font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.q2{padding:14px;text-align:left;min-height:84px}.q2 b{display:block}.q2 small{color:var(--mut)}
.set{padding:16px;text-align:left}.set b{font-size:1.15em;display:block}.set small{color:var(--mut);display:block}
.set .bar{height:8px;margin:10px 0 6px}
.lnk{display:block;margin:24px auto 0;color:var(--mut);text-decoration:underline;font-size:.85em}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 4px}
.ib{min-width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--sh);font-size:1.1em}
.top .t{flex:1;font-weight:600;text-align:center;line-height:1.3}
.tabs{display:flex;gap:6px;margin:6px 14px;background:var(--line);padding:4px;border-radius:14px}
.tabs button{flex:1;padding:6px;border-radius:11px;color:var(--mut)}.tabs .on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.pbar{margin:4px 16px 8px;height:6px}
.stage{flex:1;min-height:0;padding:6px 14px;perspective:1200px;position:relative;touch-action:pan-y}
.card{position:absolute;inset:6px 14px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:20px 20px 16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:auto;display:flex;flex-direction:column}
.back{transform:rotateY(180deg)}
.lab{font-size:.78em;color:var(--mut);letter-spacing:.04em;margin-bottom:8px}
.qt{font-size:1.1em;line-height:1.9;margin:auto 0}
.qt u{text-decoration-thickness:2px;text-underline-offset:4px}.qt sup{color:var(--bad);font-weight:700;font-size:.62em}
.hint{margin-top:auto;padding-top:10px;color:var(--mut);font-size:.8em;text-align:center}
.ans{font-size:1.35em;font-weight:700;color:var(--ok);margin-bottom:6px}
.exp{border-top:1px dashed var(--line);padding-top:12px;margin-top:auto;color:var(--bad);font-weight:500}.exp:before{content:'ব্যাখ্যা';display:block;font-size:.78em;opacity:.8;margin-bottom:2px}
.star{position:absolute;top:10px;right:12px;font-size:1.5em;width:44px;height:44px;color:var(--mut);z-index:3}.star.on{color:var(--star)}
.flag{background:var(--badb);color:var(--bad);padding:6px 10px;border-radius:10px;font-size:.8em;margin-top:10px}
.bn{font-size:.78em;color:var(--mut);float:right;margin-right:44px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:4px 16px;color:var(--mut)}
.nav button{padding:6px 12px;border-radius:12px;min-height:44px}
.act{display:flex;gap:10px;padding:8px 14px calc(10px + env(safe-area-inset-bottom))}
.act button{flex:1;min-height:56px;border-radius:18px;font-weight:600;font-size:1.05em;box-shadow:var(--sh)}
.again{background:var(--badb);color:var(--bad)}.know{background:var(--okb);color:var(--ok)}
.list{flex:1;overflow:auto;padding:8px 14px calc(20px + env(safe-area-inset-bottom))}
.li{background:var(--card);border-radius:18px;padding:12px 16px;margin-bottom:10px;box-shadow:var(--sh)}
.li .ex{display:none;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}.li.open .ex{display:block}
.li u{text-decoration-thickness:2px}.li sup{color:var(--bad);font-weight:700;font-size:.62em}
.ml{display:flex;gap:8px;margin-top:8px}.ml button{padding:4px 12px;border-radius:12px;min-height:40px;background:var(--bg)}
.sum{padding:24px 16px;text-align:center;overflow:auto;flex:1}.sum .box{margin-bottom:16px}.sum .big{margin:8px 0}
.btn{display:block;width:100%;min-height:52px;border-radius:16px;margin-bottom:10px;background:var(--card);box-shadow:var(--sh);font-weight:600}.btn.p{background:var(--acc);color:#fff}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;z-index:9}
.sheet>div{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom))}
.seg{display:flex;gap:6px;margin:8px 0 16px}.seg button{flex:1;padding:8px 4px;border-radius:12px;background:var(--bg);min-height:44px}.seg .on{background:var(--acc);color:#fff}
.card.drag .face{box-shadow:0 0 0 3px #a5d8f5,var(--sh)}.sw{text-align:center;color:var(--mut);font-size:.85em;padding-top:4px}.slideout{transition:transform .22s,opacity .22s}.enter{animation:en .25s ease-out}
@keyframes en{from{opacity:0;transform:translateX(var(--d,40px))}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card{transition:none}.enter{animation:none}}
</style></head><body><div id="app"></div>
<script>
const SETS=[{"t": "মিনি টেস্ট ০১", "cards": [{"id": "s1-1", "no": 1, "d": "ভুল অংশটি কোনটি?", "q": "Buying clothes <u>are</u><sup>A</sup> often <u>a very time-consuming</u><sup>B</sup> practice <u>because those</u><sup>C</sup> clothes that a person likes <u>are rarely the ones</u><sup>D</sup> that fit him or her.", "a": "A — are", "e": "Gerund (Buying clothes) singular subject হিসেবে গণ্য হয়; তাই are → is।", "f": 0}, {"id": "s1-2", "no": 2, "d": "ভুল অংশটি কোনটি?", "q": "<u>Because</u><sup>A</sup> they had spent <u>too many</u><sup>B</sup> time <u>considering</u><sup>C</sup> the new contract, the students <u>lost the opportunity to lease</u><sup>D</sup> the apartment.", "a": "B — too many", "e": "time uncountable noun; তাই too many → too much।", "f": 0}, {"id": "s1-3", "no": 3, "d": "ভুল অংশটি কোনটি?", "q": "<u>These</u><sup>A</sup> televisions are <u>all too expensive</u><sup>B</sup> for <u>we to buy</u><sup>C</sup> at <u>this time</u><sup>D</sup>, but perhaps we will return later.", "a": "C — we to buy", "e": "Preposition for-এর পরে object form বসে; we to buy → us to buy।", "f": 0}, {"id": "s1-4", "no": 4, "d": "ভুল অংশটি কোনটি?", "q": "After she <u>had bought</u><sup>A</sup> <u>himself</u><sup>B</sup> a new automobile, <u>she sold</u><sup>C</sup> <u>her</u><sup>D</sup> bicycle.", "a": "B — himself", "e": "কর্তা (she) নারী, তাই reflexive pronoun হবে herself; himself ভুল।", "f": 0}, {"id": "s1-5", "no": 6, "d": "ভুল অংশটি কোনটি?", "q": "Jason has <u>not</u><sup>A</sup> completed <u>the assignment</u><sup>B</sup> <u>yet</u><sup>C</sup>, and Maria <u>hasn't neither</u><sup>D</sup>.", "a": "D — hasn't neither", "e": "Negative verb-এর সাথে neither দিলে double negative হয়; হবে neither has Maria / hasn't either।", "f": 0}, {"id": "s1-6", "no": 7, "d": "ভুল অংশটি কোনটি?", "q": "John decided <u>to buy</u><sup>A</sup> <u>in the morning a new car</u><sup>B</sup>, but <u>in the afternoon</u><sup>C</sup> <u>he changed his mind</u><sup>D</sup>.", "a": "B — in the morning a new car", "e": "Object আগে, time expression পরে বসে: to buy a new car in the morning।", "f": 0}, {"id": "s1-7", "no": 8, "d": "ভুল অংশটি কোনটি?", "q": "<u>Some of the plants</u><sup>A</sup> in this store require very <u>little care</u><sup>B</sup>, but this one needs <u>much more sunlight</u><sup>C</sup> <u>than the others ones</u><sup>D</sup>.", "a": "D — than the others ones", "e": "others কখনো ones-এর আগে বসে না; হবে than the others / than the other ones।", "f": 0}, {"id": "s1-8", "no": 9, "d": "ভুল অংশটি কোনটি?", "q": "After George <u>had returned</u><sup>A</sup> <u>to his house</u><sup>B</sup>, <u>he</u><sup>C</sup> <u>was reading</u><sup>D</sup> a book.", "a": "D — was reading", "e": "After + past perfect-এর পরে main clause-এ simple past হয়: he read a book।", "f": 0}, {"id": "s1-9", "no": 10, "d": "ভুল অংশটি কোনটি?", "q": "<u>Many</u><sup>A</sup> theories on conserving the purity of water <u>has been</u><sup>B</sup> proposed, but <u>not one has</u><sup>C</sup> been <u>as widely accepted</u><sup>D</sup> as this one.", "a": "B — has been", "e": "Subject theories plural; তাই has been → have been।", "f": 0}, {"id": "s1-10", "no": 11, "d": "ভুল অংশটি কোনটি?", "q": "<u>The food</u><sup>A</sup> that Mark <u>is cooking</u><sup>B</sup> in the kitchen <u>is smelling</u><sup>C</sup> <u>delicious</u><sup>D</sup>.", "a": "C — is smelling", "e": "smell (লাগা) stative verb, continuous tense হয় না; is smelling → smells।", "f": 0}, {"id": "s1-11", "no": 12, "d": "ভুল অংশটি কোনটি?", "q": "After John <u>eaten</u><sup>A</sup> dinner, <u>he wrote</u><sup>B</sup> <u>several letters</u><sup>C</sup> and <u>went to bed</u><sup>D</sup>.", "a": "A — eaten", "e": "eaten একা verb হতে পারে না; হবে had eaten / ate।", "f": 0}, {"id": "s1-12", "no": 13, "d": "ভুল অংশটি কোনটি?", "q": "The manager <u>has finished</u><sup>A</sup> <u>working</u><sup>B</sup> <u>on the report</u><sup>C</sup> last night, and now she will begin <u>to write</u><sup>D</sup> the other proposal.", "a": "A — has finished", "e": "last night নির্দিষ্ট অতীত সময়; present perfect চলে না → finished।", "f": 1}, {"id": "s1-13", "no": 15, "d": "ভুল অংশটি কোনটি?", "q": "Daniel said that <u>if he had to do</u><sup>A</sup> <u>another</u><sup>B</sup> homework tonight, he <u>would not be able</u><sup>C</sup> <u>to attend</u><sup>D</sup> the concert.", "a": "B — another", "e": "homework uncountable; another শুধু countable singular-এর সাথে চলে → more homework।", "f": 0}, {"id": "s1-14", "no": 16, "d": "ভুল অংশটি কোনটি?", "q": "After <u>to take</u><sup>A</sup> the medication, <u>the patient</u><sup>B</sup> <u>became drowsy</u><sup>C</sup> and more <u>manageable</u><sup>D</sup>.", "a": "A — to take", "e": "After-এর পরে gerund বসে: After taking।", "f": 0}, {"id": "s1-15", "no": 18, "d": "ভুল অংশটি কোনটি?", "q": "It <u>has</u><sup>A</sup> been <u>a long time</u><sup>B</sup> <u>since</u><sup>C</sup> we have talked to John, <u>isn't it</u><sup>D</sup>?", "a": "D — isn't it", "e": "Main verb has been; তাই question tag হবে hasn't it?", "f": 0}, {"id": "s1-16", "no": 19, "d": "ভুল অংশটি কোনটি?", "q": "Henry objects to <u>our buying</u><sup>A</sup> this house <u>without the approval</u><sup>B</sup> <u>of our attorney</u><sup>C</sup>, and <u>John does so</u><sup>D</sup>.", "a": "D — John does so", "e": "একই মত বোঝাতে so + auxiliary + subject: so does John।", "f": 0}, {"id": "s1-17", "no": 20, "d": "ভুল অংশটি কোনটি?", "q": "Rita enjoyed <u>to be</u><sup>A</sup> <u>able to meet</u><sup>B</sup> <u>several</u><sup>C</sup> members of Congress during <u>her vacation</u><sup>D</sup>.", "a": "A — to be", "e": "enjoy-এর পরে gerund বসে: enjoyed being।", "f": 0}, {"id": "s1-18", "no": 21, "d": "ভুল অংশটি কোনটি?", "q": "<u>After being</u><sup>A</sup> indicted <u>for</u><sup>B</sup> his part in a bank robbery, <u>the reputed</u><sup>C</sup> mobster decided <u>find</u><sup>D</sup> another attorney.", "a": "D — find", "e": "decide-এর পরে to-infinitive বসে: decided to find।", "f": 0}, {"id": "s1-19", "no": 22, "d": "ভুল অংশ rd</u><sup>D</sup>.", "a": "B — last night outdoors", "e": "Place আগে, time পরে: outdoors last night।", "f": 0}, {"id": "s1-26", "no": 34, "d": "ভুল অংশটি কোনটি?", "q": "<u>People</u><sup>A</sup> respected George Washington <u>because</u><sup>B</sup> he was <u>a honest man</u><sup>C</sup>, and he turned out to be <u>one of our greatest</u><sup>D</sup> military leaders.", "a": "C — a honest man", "e": "honest-এর h নীরব, স্বরধ্বনি দিয়ে শুরু; তাই an honest man।", "f": 0}, {"id": "s1-27", "no": 35, "d": "ভুল অংশটি কোনটি?", "q": "He isn't <u>driving</u><sup>A</sup> <u>to the</u><sup>B</sup> convention <u>in March</u><sup>C</sup>, and <u>neither they are</u><sup>D</sup>.", "a": "D — neither they are", "e": "Neither-এর পরে inversion হয়: neither are they।", "f": 0}, {"id": "s1-28", "no": 36, "d": "ভুল অংশটি কোনটি?", "q": "Catherine <u>is studying</u><sup>A</sup> <u>law</u><sup>B</sup> <u>at the university</u><sup>C</sup>, and <u>so does John</u><sup>D</sup>.", "a": "D — so does John", "e": "Verb is studying; তাই so + is + subject: so is John।", "f": 0}, {"id": "s1-29", "no": 37, "d": "ভুল অংশটি কোনটি?", "q": "The company <u>has</u><sup>A</sup> <u>so little</u><sup>B</sup> money <u>that it</u><sup>C</sup> <u>can't hardly</u><sup>D</sup> operate anymore.", "a": "D — can't hardly", "e": "hardly নিজেই negative; can't hardly double negative → can hardly।", "f": 0}, {"id": "s1-30", "no": 38, "d": "ভুল অংশটি কোনটি?", "q": "<u>My cousin</u><sup>A</sup> attends <u>an university</u><sup>B</sup> in the Midwest which <u>specializes</u><sup>C</sup> <u>in astronomy</u><sup>D</sup>.", "a": "B — an university", "e": "university-এর u-এর উচ্চারণ /ju/ (ব্যঞ্জন ধ্বনি); তাই a university।", "f": 0}, {"id": "s1-31", "no": 39, "d": "ভুল অংশটি কোনটি?", "q": "The students <u>were</u><sup>A</sup> <u>interested</u><sup>B</sup> <u>in take</u><sup>C</sup> a field trip to The National History Museum, but they <u>were not able to raise</u><sup>D</sup> enough money.", "a": "C — in take", "e": "Prepositio ", "no": 34, "d": "ভুল অংশটি কোনটি?", "q": "<u>After learning</u><sup>A</sup> all the details <u>about the project</u><sup>B</sup>, the contractor told <u>us them</u><sup>C</sup> at the <u>planning meeting</u><sup>D</sup>.", "a": "C — us them", "e": "Pronoun object-এর ক্রম: told them to us।", "f": 0}]}, {"t": "মিনি টেস্ট ০৫", "cards": [{"id": "s5-1", "no": 1, "d": "সঠিকটি কোনটি?", "q": "Scientists are trying to (device/devise) an inexpensive substitute for gasoline.", "a": "devise", "e": "devise = উদ্ভাবন করা (verb); device = যন্ত্র (noun)।", "f": 0}, {"id": "s5-2", "no": 2, "d": "সঠিকটি কোনটি?", "q": "On Halloween night, most children dress in (costumes/customs) and go from house to house asking for treats.", "a": "costumes", "e": "costumes = পোশাক; customs = রীতিনীতি।", "f": 0}, {"id": "s5-3", "no": 3, "d": "সঠিকটি কোনটি?", "q": "Mr. Miller's prejudice (of/toward) his neighbors caused him to be ostracized.", "a": "toward", "e": "prejudice-এর পরে toward/against বসে।", "f": 0}, {"id": "s5-4", "no": 4, "d": "সঠিকটি কোনটি?", "q": "(Besides/Beside) geology, Herman is studying math, French, and literature.", "a": "Besides", "e": "Besides = ছাড়াও/অতিরিক্ত; beside = পাশে।", "f": 0}, {"id": "s5-5", "no": 5, "d": "সঠিকটি কোনটি?", "q": "Melanie said that she would arrive (later/latter) than the rest of us.", "a": "later", "e": "later = পরে (সময়); latter = শেষোক্ত।", "f": 0}, {"id": "s5-6", "no": 6, "d": "সঠিকটি কোনটি?", "q": "Despite his superb muscle, Paul planned on participating (with/in) the Olympic skating.", "a": "in", "e": "participate in = অংশগ্রহণ করা।", "f": 0}, {"id": "s5-7", "no": 7, "d": "সঠিকটি কোনটি?", "q": "A fear (at/of) closed-in areas is called claustrophobia.", "a": "of", "e": "fear of = কিছুর ভয়।", "f": 0}, {"id": "s5-8", "no": 8, "d": "সঠিকটি কোনটি?", "q": "After being apprehended, all hijackers are (persecuted/prosecuted).", "a": "prosecuted", "e": "prosecute = আইনত বিচার করা; persecute = নিপীড়ন করা।", "f": 0}, {"id": "s5-9", "no": 9, "d": "সঠিকটি কোনটি?", "q": "Mitzi didn't (loose/lose) any time in applying for the teaching position in math.", "a": "lose", "e": "lose = হারানো/নষ্ট করা; loose = ঢিলা।", "f": 0}, {"id": "s5-10", "no": 10, "d": "সঠিকটি কোনটি?", "q": "The letters were (already/all ready) for mailing when we realized that we had written the wrong addresses on the envelopes.", "a": "all ready", "e": "all ready = সম্পূর্ণ প্রস্তুত; already = আগেই।", "f": 0}, {"id": "s5-11", "no": 11, "d": "সঠিকটি কোনটি?", "q": "This report is (quite/quiet) complete and needs no revision.", "a": "quite", "e": "quite = বেশ/সম্পূর্ণ; quiet = শান্ত।", "f": 0}, {"id": "s5-12", "no": 12, "d": "সঠিকটি কোনটি?", "q": "Professor Baker teaches the same number of hours per week as Professor Jones, but the (later/latter) always looks more tired.", "a": "latter", "e": "দুইজনের মধ্যে শেষোক্তজন = the latter।", "f": 0}, {"id": "s5-13", "no": 13, "d": "সঠিকটি কোনটি?", "q": "Ms. Davis asked us to help pass (out/up) some free (samples/examples).", "a": "out, samples", "e": "pass out = বিতরণ করা; free samples = বিনামূল্যের নমুনা।", "f": 0}, {"id": "s5-14", "no": 14, "d": "সঠিকটি কোনটি?", "q": "Julie's skirt will be (to/too) (lose/loose) for her sister to wear.", "a": "too, loose", "e": "too = অতিরিক্ত; loose = ঢিলা।", "f": 0}, {"id": "s5-15", "no": 15, "d": "সঠিকটি কোনটি?", "q": "Even though Marlon Brando had won an Oscar, he refused to (except/accept) in the presentation ceremonies.", "a": "accept", "e": "accept = গ্রহণ করা; except = ব্যতীত।", "f": 0}, {"id": "s5-16", "no": 16, "d": "সঠিকটি কোনটি?", "q": "Louis was <u>depending on</u> the Pittsburgh Steelers to win the championship. (picking out/counting on)", "a": "counting on", "e": "depend on = count on (নির্ভর করা)।", "f": 0}, {"id": "s5-17", "no": 17, "d": "সঠিকটি কোনটি?", "q": "Dr. Clements <u>distributed</u> the materials at the deans' conference. (passed out/brought up)", "a": "passed out", "e": "distribute = pass out (বিতরণ করা)।", "f": 0}, {"id": "s5-18", "no": 18, "d": "সঠিকটি কোনটি?", "q": "Archeologists <u>continue</u> searching for buried Egyptian treasures. (keep on/do away with)", "a": "keep on", "e": "continue = keep on (চালিয়ে যাওয়া)।", "f": 0}, {"id": "s5-19", "no": 19, "d": "সঠিকটি কোনটি?", "q": "Four armed men <u>robbed</u> the bank last week and escaped with an undetermined amount of cash. (held up/pointed out)", "a": "held up", "e": "rob = hold up (ডাকাতি করা)।", "f": 0}, {"id": "s5-20", "no": 20, "d": "সঠিকটি কোনটি?", "q": "We had to <u>postpone</u> the meeting because too many people had the flu. (drop out of/put off)", "a": "put off", "e": "postpone = put off (স্থগিত করা)।", "f": 0}, {"id": "s5-21", "no": 21, "d": "সঠিকটি কোনটি?", "q": "When Karen became ill, her colleagues had to <u>manage</u> without her. (get along/take off)", "a": "get along", "e": "manage = get along (চালিয়ে নেওয়া)।", "f": 0}, {"id": "s5-22", "no": 22, "d": "সঠিকটি কোনটি?", "q": "The department chairman <u>asked</u> his staff to help with the registration. (called on/counted on)", "a": "called on", "e": "ask (অনুরোধ করা) = call on।", "f": 0}, {"id": "s5-23", "no": 23, "d": "সঠিকটি কোনটি?", "q": "If we <u>terminate</u> our relations with that country, we'll have to find another supplier of raw materials. (break off/draw up)", "a": "break off", "e": "terminate = break off (সম্পর্ক ছিন্ন করা)।", "f": 0}, {"id": "s5-24", "no": 24, "d": "সঠিকটি কোনটি?", "q": "After arriving at the check-in counter, Dennis <u>discovered</u> that he was in the wrong airport. (found out/pointed out)", "a": "found out", "e": "discover = find out (জানতে পারা)।", "f": 0}, {"id": "s5-25", "no": 25, "d": "সঠিকটি কোনটি?", "q": "Kevin <u>quit</u> the engineering program because he found it too difficult. (checked out of/dropped out of)", "a": "dropped out of", "e": "quit = drop out of (ছেড়ে দেওয়া)।", "f": 0}, {"id": "s5-26", "no": 26, "d": "সঠিকটি কোনটি?", "q": "The gasoline fumes caused Mike to <u>faint</u>. (pass out/break off)", "a": "pass out", "e": "faint = pass out (অজ্ঞান হওয়া)।", "f": 0}, {"id": "s5-27", "no": 27, "d": "সঠিকটি কোনটি?", "q": "The baseball game had to be <u>postponed</u> because of the inclement weather. (put off/put on)", "a": "put off", "e": "postpone = put off (স্থগিত করা)।", "f": 0}, {"id": "s5-28", "no": 28, "d": "সঠিকটি কোনটি?", "q": "All bids for the project had to be <u>submitted</u> by November 1. (turned in/drawn up)", "a": "turned in", "e": "submit = turn in (জমা দেওয়া)।", "f": 0}, {"id": "s5-29", "no": 29, "d": "সঠিকটি কোনটি?", "q": "Because she is so tall, Sandy doesn't <u>like</u> high-heeled shoes. (care for/pick out)", "a": "care for", "e": "like = care for (পছন্দ করা)।", "f": 0}, {"id": "s5-30", "no": 30, "d": "সঠিকটি কোনটি?", "q": "My adviser <u>indicated</u> numerous errors in my proposal and told me to rewrite it. (figured out/pointed out)", "a": "pointed out", "e": "indicate = point out (চিহ্নিত করে দেখানো)।", "f": 0}]}, {"t": "মিনি টেস্ট ০৬", "cards": [{"id": "s6-1", "no": 1, "d": "ভুল অংশটি কোনটি?", "q": "<u>Even though</u><sup>A</sup> the girls have <u>all ready</u><sup>B</sup> visited St. Augustine, <u>they</u><sup>C</sup> want <u>to return</u><sup>D</sup> to the Castillo de San Marcos.", "a": "B — all ready", "e": "all ready = সবাই প্রস্তুত; 'আগেই' বোঝাতে already।", "f": 0}, {"id": "s6-2", "no": 2, "d": "ভুল অংশটি কোনটি?", "q": "<u>As a result of</u><sup>A</sup> his inconsistency <u>in represent</u><sup>B</sup> his constituents, the senator was not <u>reelected</u><sup>C</sup> <u>to the state legislature</u><sup>D</sup>.", "a": "B — in represent", "e": "Preposition in-এর পরে gerund: in representing।", "f": 0}, {"id": "s6-3", "no": 3, "d": "ভুল অংশটি কোনটি?", "q": "<u>Knowing that</u><sup>A</sup> it would be <u>helpless</u><sup>B</sup> to continue <u>working</u><sup>C</sup> for a nearly bankrupt company, Louise decided to go away and find <u>another type</u><sup>D</sup> of employment.", "a": "B — helpless", "e": "helpless = অসহায়; এখানে অর্থ 'নিরর্থক' → futile/useless।", "f": 0}, {"id"
